[package]
name = "ui-automata"
description = "Declarative Workflow Engine for UI Automation"
repository = "https://github.com/ivrtym/ui-automata-linux"
version = { workspace = true }
edition = "2024"
license = "MIT"

[lib]
name = "ui_automata"
path = "src/lib.rs"

[features]
mock = []

[dependencies]
log = { workspace = true }
fancy-regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
serde_path_to_error = "0.1.20"
saphyr = "0.0.6"
saphyr-parser = "0.0.6"
dirs = { workspace = true }

[dev-dependencies]
ui-automata = { path = ".", features = ["mock"] }
