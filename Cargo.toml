[workspace]
resolver = "2"
members = [
    "automata-browser",
    "automata-linux",
    "automata-service",
    "ui-automata",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Core
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Async / WebSocket
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"

# Time / misc
chrono = "0.4"
dirs = "5.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# ui-automata specific
fancy-regex = "0.17"
serde_yaml = "0.9"
schemars = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }

# Linux (automata-linux)
atspi = { version = "0.30", features = ["tokio", "zbus"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
