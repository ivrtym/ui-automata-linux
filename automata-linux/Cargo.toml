[package]
name = "automata-linux"
description = "Declarative Workflow Engine for Linux Desktop UI Automation (AT-SPI2 + OCR fallback)"
repository = "https://github.com/ivrtym/ui-automata-linux"
version = { workspace = true }
edition = { workspace = true }
license = "MIT"

[lib]
name = "automata_linux"
path = "src/lib.rs"

[features]
default = ["ocr-ort"]
ocr-ort = ["dep:ort", "dep:ndarray"]

[dependencies]
ui-automata = { path = "../ui-automata", version = "0.1.0" }
automata-browser = { path = "../automata-browser", version = "0.1.0" }

anyhow = { workspace = true }
atspi = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
fern = { version = "0.7", features = ["colored"] }
clap = { workspace = true }
time = { workspace = true }
image = "0.25"
x11rb = { version = "0.14", features = ["xtest"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"], optional = true }
